<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Abhinav Pathak — Portfolio</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="portfolio-data.js"></script>
  </head>
  <body>
    <div class="js-container"></div>
    <p id="portfolio-data-status" class="portfolio-data-status" role="alert" hidden></p>

    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      let portfolio = window.portfolioDefaults;

      /* ── Smooth scroll helper ── */
      function scrollToSection(id) {
        const el = document.getElementById(id);
        const behavior = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
        if (el) el.scrollIntoView({ behavior });
      }

      /* ── NAVBAR ── */
      function Navbar() {
        return (
          <nav id="navbar">
            <a id="portfolio-title" href="#section-profile" aria-label="Abhinav Pathak home">
              <span className="brand-mark">AP</span>
              <span className="brand-name">{portfolio.profile.details[0].value}</span>
            </a>
            <button className="hamburger" id="hamburger-btn" aria-label="Toggle navigation" aria-expanded="false" onClick={() => {
              const menu = document.getElementById('nav-menu');
              const isOpen = menu.classList.toggle('open');
              document.getElementById('hamburger-btn').setAttribute('aria-expanded', String(isOpen));
            }}>
              <span></span><span></span><span></span>
            </button>
            <div id="nav-menu">
              <button onClick={() => scrollToSection('section-profile')}>Home</button>
              <button onClick={() => scrollToSection('section-about')}>About</button>
              <button onClick={() => scrollToSection('section-skills')}>Skills</button>
              <button onClick={() => scrollToSection('section-projects')}>Projects</button>
              <button onClick={() => scrollToSection('section-certs')}>Certificates</button>
              <button onClick={() => scrollToSection('section-badges')}>Badges</button>
              <button onClick={() => scrollToSection('section-feedback')} className="nav-cta">Contact</button>
              <a className="admin-login-link" href="admin.html">Admin Login</a>
            </div>
          </nav>
        );
      }

      /* ── HERO / PROFILE ── */
      function Profile() {
        const name = portfolio.profile.details.find(item => item.label === 'NAME')?.value || portfolio.brand;
        const contactDetails = portfolio.profile.details.filter(item => item.label !== 'NAME' && item.label !== 'DOB');
        return (
          <section id="section-profile" className="hero-section">
            <div className="hero-copy">
              <p className="hero-kicker">{portfolio.profile.subtitle}</p>
              <h1>Hi, I’m <span>{name}</span></h1>
              <p className="hero-intro">{portfolio.profile.welcome.replace(/^>\s*/, '').replace(/_$/, '')}</p>
              <div className="hero-actions">
                <button className="hero-primary" onClick={() => scrollToSection('section-projects')}>View My Projects <span aria-hidden="true">→</span></button>
                <button className="hero-secondary" onClick={() => scrollToSection('section-feedback')}>Get in touch</button>
              </div>
            </div>
            <div className="hero-portrait">
              <div className="profile-img-wrap">
                <img src={portfolio.profile.image} id="profile-image"
                  alt={name} />
              </div>
              <span className="portrait-accent" aria-hidden="true"></span>
            </div>
            <aside className="hero-contact-card" aria-label="Profile details">
              <p className="hero-card-title">Profile details</p>
              {contactDetails.map(item => (
                <div className="hero-contact-item" key={item.label}>
                  <span className="contact-icon" aria-hidden="true">
                    {item.label === 'EMAIL' ? '✉' : item.label === 'PHONE' ? '⌕' : item.label === 'LINKEDIN' ? 'in' : '⌖'}
                  </span>
                  <span className="hero-contact-copy">
                    <span className="label">{item.label}</span>
                    <span className="value">
                      {item.href
                        ? <a href={item.href} target={item.href.startsWith('http') ? '_blank' : undefined} rel="noopener noreferrer">{item.value}</a>
                        : item.value}
                    </span>
                  </span>
                </div>
              ))}
              <div className="availability"><span></span> Available for opportunities</div>
            </aside>
          </section>
        );
      }

      /* ── ABOUT ── */
      function About() {
        return (
          <section id="section-about" className="section">
            <div className="section-header">
              <span className="section-tag">02</span>
              <h2>About</h2>
            </div>
            <p className="section-sub">{portfolio.about.subtitle}</p>
            <div className="about-card">
              <div className="about-terminal-bar">
                <span></span><span></span><span></span>
                <span className="terminal-title">about.md</span>
              </div>
              <div className="about-body">
                {portfolio.about.paragraphs.map((paragraph, index) => (
                  <p key={index}>
                    {paragraph.split(/(full-stack AI engineer|Python|Java and Kotlin|React|secure, scalable, and deployment-ready\.)/g)
                      .map((part, partIndex) => /^(full-stack AI engineer|Python|Java and Kotlin|React|secure, scalable, and deployment-ready\.)$/.test(part)
                        ? <strong key={partIndex}>{part}</strong>
                        : part)}
                  </p>
                ))}
              </div>
            </div>
          </section>
        );
      }

      /* ── SKILLS ── */
      function SkillItem({ icon, label }) {
        return (
          <div className="skill-item">
            <span className="skill-icon">{icon}</span>
            <span>{label}</span>
          </div>
        );
      }

      function Skills() {
        return (
          <section id="section-skills" className="section">
            <div className="section-header">
              <span className="section-tag">03</span>
              <h2>Skills</h2>
            </div>
            <p className="section-sub">{portfolio.skills.subtitle}</p>
            <div className="skills-grid">
              {portfolio.skills.items.map((skill, index) =>
                <SkillItem key={index} icon={skill.icon} label={skill.label} />)}
            </div>
          </section>
        );
      }

      async function submitContactMessage(event) {
        event.preventDefault();
        const form = event.currentTarget;
        const email = form.elements.email.value.trim();
        const messageText = form.elements.message.value.trim();
        const status = document.getElementById('contact-status');
        const emailAddress = portfolio.footer.email.replace(/^mailto:/, '');
        const submitButton = form.querySelector('button[type="submit"]');

        submitButton.disabled = true;
        status.textContent = 'Saving your message…';
        try {
          await window.savePortfolioMessage({ email, message: messageText });
          status.textContent = 'Message saved. Review the email draft and send it from your email app.';
          const subject = encodeURIComponent('Portfolio contact message');
          const body = encodeURIComponent(`From: ${email}\n\n${messageText}`);
          window.location.href = `mailto:${emailAddress}?subject=${subject}&body=${body}`;
          form.reset();
        } catch (error) {
          status.textContent = `Could not save your message: ${error.message}`;
        } finally {
          submitButton.disabled = false;
        }
      }

      /* ── CERT CARD ── */
      function CertCard({ image, title, from, description, index }) {
        return (
          <div className="cert-card" style={{ animationDelay: `${index * 0.08}s` }}>
            <div className="cert-img-wrap">
              <img src={image} alt={title} />
              <div className="cert-img-overlay">
                <span className="cert-from-badge">{from}</span>
              </div>
            </div>
            <div className="cert-body">
              <h5>{title}</h5>
              <h6>{from}</h6>
              <p>{description}</p>
            </div>
          </div>
        );
      }

      /* ── CERTIFICATIONS ── */
      function Certifications() {
        return (
          <section id="section-certs" className="section">
            <div className="section-header">
              <span className="section-tag">04</span>
              <h2>Certifications</h2>
            </div>
            <p className="section-sub">{portfolio.certifications.subtitle}</p>
            {portfolio.certifications.groups.map((group, groupIndex) => (
              <React.Fragment key={groupIndex}>
                <h3 className="cert-group-label">▸ {group.label}</h3>
                <div className="cert-grid">
                  {group.items.map((cert, index) => (
                    <CertCard key={`${groupIndex}-${index}`} index={index} {...cert} />
                  ))}
                </div>
              </React.Fragment>
            ))}
          </section>
        );
      }

      function Badges() {
        const items = portfolio.badges.items.filter(badge => badge.title || badge.image);
        return (
          <section id="section-badges" className="section">
            <div className="section-header">
              <span className="section-tag">05</span>
              <h2>Badges</h2>
            </div>
            <p className="section-sub">{portfolio.badges.subtitle}</p>
            {items.length > 0 ? (
              <div className="badge-viewer" aria-label="Digital badges">
                <div className="badge-grid">
                {items.map((badge, index) => (
                  <article className="badge-card" key={index}>
                    {badge.image && <div className="badge-image-wrap"><img src={badge.image} alt={`${badge.title} badge`} loading="lazy" /></div>}
                    <div className="badge-body">
                      <h3>{badge.title}</h3>
                      {badge.from && <p className="badge-issuer">{badge.from}</p>}
                      {badge.description && <p>{badge.description}</p>}
                    </div>
                  </article>
                ))}
                </div>
              </div>
            ) : (
              <p className="badge-empty">Badges will appear here when added.</p>
            )}
          </section>
        );
      }

      /* ── PROJECT CARD ── */
      function ProjectCard({ image, title, description, link, website, websiteLabel, tag, index }) {
        return (
          <article
            className="project-card project-card-linked"
            style={{ animationDelay: `${index * 0.1}s` }}
          >
            <a className="project-card-overlay" href={`project.html?project=${index}`} aria-label={`View ${title} project details`}></a>
            <div className="project-img-wrap">
              <img src={image} alt={title} />
              <span className="project-tag">{tag}</span>
            </div>
            <div className="project-body">
              <h5>{title}</h5>
              <p>{description}</p>
              <div className="project-actions">
              <a href={`project.html?project=${index}`} className="project-link project-details-link">
                Project details <span aria-hidden="true">→</span>
              </a>
              {website && <a href={website} className="project-link project-website-link">
                {websiteLabel || 'Open Website'} <span aria-hidden="true">↗</span>
              </a>}
              <a href={link} target="_blank" rel="noopener noreferrer" className="project-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
                </svg>
                View on GitHub
              </a>
              </div>
            </div>
          </article>
        );
      }

      /* ── PROJECTS ── */
      function Projects() {
        return (
          <section id="section-projects" className="section">
            <div className="section-header">
              <span className="section-tag">06</span>
              <h2>Projects</h2>
            </div>
            <p className="section-sub">{portfolio.projects.subtitle}</p>
            <div className="project-grid">
              {portfolio.projects.items.map((project, index) => (
                <ProjectCard key={index} index={index} {...project} />
              ))}
            </div>
          </section>
        );
      }

      /* ── FEEDBACK ── */
      function Feedback() {
        return (
          <section id="section-feedback" className="section">
            <div className="section-header">
              <span className="section-tag">07</span>
              <h2>Contact</h2>
            </div>
            <p className="section-sub">{portfolio.contact.subtitle}</p>
            <div className="feedback-card">
              <div className="feedback-terminal-bar">
                <span></span><span></span><span></span>
                <span className="terminal-title">send_message.sh</span>
              </div>
              <form className="feedback-body" onSubmit={submitContactMessage}>
                <div className="form-group">
                  <label htmlFor="fb-email">Your Email</label>
                  <input type="email" id="fb-email" name="email" placeholder="you@example.com" autoComplete="email" required />
                </div>
                <div className="form-group">
                  <label htmlFor="fb-msg">Message</label>
                  <textarea id="fb-msg" name="message" rows="5" placeholder="Type your message here..." required></textarea>
                </div>
                <button className="submit-btn" type="submit">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                  </svg>
                  Send Message
                </button>
                <p id="contact-status" className="contact-status" role="status" aria-live="polite"></p>
              </form>
            </div>
          </section>
        );
      }

      /* ── FOOTER ── */
      function Footer() {
        return (
          <footer>
            <div className="footer-inner">
              <p className="footer-name">{portfolio.footer.name}</p>
              <p className="footer-copy">{portfolio.footer.copy}</p>
              <div className="footer-links">
                <a href={portfolio.footer.email}>Email</a>
                <a href={portfolio.footer.linkedin} target="_blank" rel="noopener noreferrer">LinkedIn</a>
                <a href={portfolio.footer.github} target="_blank" rel="noopener noreferrer">GitHub</a>
              </div>
            </div>
          </footer>
        );
      }

      /* ── APP ── */
      function App() {
        return (
          <div className="app-root">
            <Navbar />
            <Profile />
            <main>
              <div className="content-grid">
                <About />
                <Skills />
                <Certifications />
                <Projects />
                <Badges />
                <Feedback />
              </div>
            </main>
            <Footer />
          </div>
        );
      }

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
      window.loadPortfolioData().then(data => {
        portfolio = data;
        document.getElementById('portfolio-data-status').hidden = true;
        root.render(<App />);
      }).catch(error => {
        console.error('Unable to load shared portfolio content:', error);
        const status = document.getElementById('portfolio-data-status');
        status.textContent = 'Live portfolio content could not be loaded from the server. The built-in preview is shown; please try again later.';
        status.hidden = false;
      });

    </script>
  </body>
</html>
