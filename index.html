<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Abhinav Pathak — Portfolio</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">

      /* ── Smooth scroll helper ── */
      function scrollTo(id) {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      }

      /* ── NAVBAR ── */
      function Navbar() {
        return (
          <nav id="navbar">
            <div id="portfolio-title">
              <span class="nav-bracket">&lt;</span>
              <h1>Abhinav.dev</h1>
              <span class="nav-bracket">/&gt;</span>
            </div>
            <button class="hamburger" id="hamburger-btn" onClick={() => {
              const menu = document.getElementById('nav-menu');
              menu.classList.toggle('open');
            }}>
              <span></span><span></span><span></span>
            </button>
            <div id="nav-menu">
              <button onClick={() => scrollTo('section-profile')}>Profile</button>
              <button onClick={() => scrollTo('section-about')}>About</button>
              <button onClick={() => scrollTo('section-skills')}>Skills</button>
              <button onClick={() => scrollTo('section-certs')}>Certs</button>
              <button onClick={() => scrollTo('section-projects')}>Projects</button>
              <button onClick={() => scrollTo('section-feedback')} class="nav-cta">Contact</button>
            </div>
          </nav>
        );
      }

      /* ── HERO / PROFILE ── */
      function Profile() {
        return (
          <section id="section-profile" class="section">
            <div class="section-header">
              <span class="section-tag">01</span>
              <h2>Profile</h2>
            </div>
            <p class="section-sub">Full-Stack AI Engineer · Cybersecurity Analyst · Android Developer</p>

            <div class="profile-card">
              <div class="profile-img-wrap">
                <img src="Profileimg.jpeg" id="profile-image" alt="Abhinav Pathak" />
                <div class="profile-img-ring"></div>
                <div class="status-dot"></div>
              </div>

              <div class="profile-info">
                <p class="profile-welcome">&gt; Welcome to my portfolio_</p>
                <div class="profile-grid">
                  <div class="profile-item">
                    <span class="label">NAME</span>
                    <span class="value">Abhinav Pathak</span>
                  </div>
                  <div class="profile-item">
                    <span class="label">DOB</span>
                    <span class="value">15th September 2005</span>
                  </div>
                  <div class="profile-item">
                    <span class="label">PHONE</span>
                    <span class="value">+91 9302514236</span>
                  </div>
                  <div class="profile-item">
                    <span class="label">EMAIL</span>
                    <span class="value"><a href="mailto:Pabhinav9001@gmail.com">Pabhinav9001@gmail.com</a></span>
                  </div>
                  <div class="profile-item full">
                    <span class="label">ADDRESS</span>
                    <span class="value">NH-1/B-196 NTPC Colony Vindhyanagar</span>
                  </div>
                  <div class="profile-item full">
                    <span class="label">LINKEDIN</span>
                    <span class="value">
                      <a href="https://www.linkedin.com/in/Abhinav-Pathak-aa6a35233/" target="_blank">
                        linkedin.com/in/Abhinav-Pathak-aa6a35233
                      </a>
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </section>
        );
      }

      /* ── ABOUT ── */
      function About() {
        return (
          <section id="section-about" class="section">
            <div class="section-header">
              <span class="section-tag">02</span>
              <h2>About</h2>
            </div>
            <p class="section-sub">Background, philosophy, and what drives me.</p>
            <div class="about-card">
              <div class="about-terminal-bar">
                <span></span><span></span><span></span>
                <span class="terminal-title">about.md</span>
              </div>
              <div class="about-body">
                <p>
                  I am a <strong>full-stack AI engineer</strong> building secure, production-grade applications
                  across web, mobile, and backend systems. My expertise includes computer vision pipelines,
                  facial recognition systems, fraud detection architectures, and IAM solution design.
                </p>
                <p>
                  I develop backend systems in <strong>Python</strong>, Android applications using
                  <strong> Java and Kotlin</strong>, and responsive web platforms using <strong>React</strong>.
                  I specialize in integrating machine learning models into scalable application architectures
                  while ensuring encryption, access control, and system integrity.
                </p>
                <p>
                  I focus on engineering solutions that are not only intelligent, but
                  <strong> secure, scalable, and deployment-ready.</strong>
                </p>
              </div>
            </div>
          </section>
        );
      }

      /* ── SKILLS ── */
      function SkillItem({ icon, label }) {
        return (
          <div class="skill-item">
            <span class="skill-icon">{icon}</span>
            <span>{label}</span>
          </div>
        );
      }

      function Skills() {
        return (
          <section id="section-skills" class="section">
            <div class="section-header">
              <span class="section-tag">03</span>
              <h2>Skills</h2>
            </div>
            <p class="section-sub">Technologies, tools, and languages I work with.</p>
            <div class="skills-grid">
              <SkillItem icon="⚡" label="Python · Java · C++" />
              <SkillItem icon="🌐" label="HTML · CSS · JavaScript · React" />
              <SkillItem icon="🗄️" label="MySQL · Firebase" />
              <SkillItem icon="🔧" label="Git · GitHub · Android Studio · VS Code" />
              <SkillItem icon="📱" label="Android SDK · Kotlin · Java" />
              <SkillItem icon="🔐" label="Ethical Hacking · IAM · Cybersecurity" />
              <SkillItem icon="🤖" label="Computer Vision · ML · Deep Learning" />
              <SkillItem icon="🗣️" label="English · Hindi" />
            </div>
          </section>
        );
      }

      /* ── CERT CARD ── */
      function CertCard({ image, title, from, description, index }) {
        return (
          <div class="cert-card" style={{ animationDelay: `${index * 0.08}s` }}>
            <div class="cert-img-wrap">
              <img src={image} alt={title} />
              <div class="cert-img-overlay">
                <span class="cert-from-badge">{from}</span>
              </div>
            </div>
            <div class="cert-body">
              <h5>{title}</h5>
              <h6>{from}</h6>
              <p>{description}</p>
            </div>
          </div>
        );
      }

      /* ── CERTIFICATIONS ── */
      function Certifications() {
        return (
          <section id="section-certs" class="section">
            <div class="section-header">
              <span class="section-tag">04</span>
              <h2>Certifications</h2>
            </div>
            <p class="section-sub">Courses and virtual internships I have completed.</p>

            <h3 class="cert-group-label">▸ Course Certifications</h3>
            <div class="cert-grid">
              <CertCard index={0} image="certi1.jpeg" title="Android Development" from="Teachnook"
                description="Completed a full-stack Android development certification covering core SDK, architecture patterns, and deployment-ready practices." />
              <CertCard index={1} image="certi2.jpeg" title="Generative AI" from="Internshala"
                description="Completed a beginner-to-intermediate Generative AI course covering LLMs, prompt engineering, and practical AI application development." />
              <CertCard index={2} image="certi3.jpeg" title="Ethical Hacking" from="Internshala"
                description="Completed a foundational ethical hacking course covering penetration testing, vulnerability assessment, and security best practices." />
            </div>

            <h3 class="cert-group-label">▸ Virtual Internships</h3>
            <div class="cert-grid">
              <CertCard index={0} image="certi4.jpeg" title="Cyber Security Analyst" from="Deloitte"
                description="Simulated real-world consulting tasks: analyzed security logs, identified suspicious activities, assessed risks, and recommended mitigation strategies aligned with business objectives." />
              <CertCard index={1} image="certi5.jpeg" title="Cybersecurity Job Simulation" from="Mastercard"
                description="Served as an analyst on Mastercard's Security Awareness Team. Identified phishing threats and implemented security training procedures for vulnerable business units." />
              <CertCard index={2} image="certi6.jpeg" title="Cybersecurity Virtual Internship" from="AIG"
                description="Performed threat analysis for the Cyber Defense Unit. Researched CISA vulnerabilities, drafted remediation guidance, and wrote a Python brute-force decryption script for ethical hacking." />
              <CertCard index={3} image="certi7.jpeg" title="Cybersecurity Virtual Internship" from="Tata"
                description="Completed an IAM-focused simulation for TCS Cybersecurity Consulting. Delivered documentation on identity governance, access control, and strategic cybersecurity alignment." />
            </div>
          </section>
        );
      }

      /* ── PROJECT CARD ── */
      function ProjectCard({ image, title, description, link, tag, index }) {
        return (
          <div class="project-card" style={{ animationDelay: `${index * 0.1}s` }}>
            <div class="project-img-wrap">
              <img src={image} alt={title} />
              <span class="project-tag">{tag}</span>
            </div>
            <div class="project-body">
              <h5>{title}</h5>
              <p>{description}</p>
              <a href={link} target="_blank" class="project-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
                </svg>
                View on GitHub
              </a>
            </div>
          </div>
        );
      }

      /* ── PROJECTS ── */
      function Projects() {
        return (
          <section id="section-projects" class="section">
            <div class="section-header">
              <span class="section-tag">05</span>
              <h2>Projects</h2>
            </div>
            <p class="section-sub">Production-grade systems I've engineered.</p>
            <div class="project-grid">
              <ProjectCard index={0} image="project1.jpeg" title="NewsApp" tag="API · Android Studio.java"
                description="A live news aggregator app powered by a public API, featuring category filters and real-time article fetching."
                link="https://github.com" />
              <ProjectCard index={1} image="project2.jpeg" title="Attendance Management System" tag="Firebase · Android Studio.java"
                description="Smart attendance system using facial recognition. Built with OpenCV and Android SDK — no manual input required."
                link="https://github.com" />
              <ProjectCard index={2} image="project3.jpeg" title="Malware & Fraud Detection" tag="ML · Deep Learning. python"
                description="Hybrid ML/DL system that detects malware in files and identifies fraudulent messages and phishing links with high precision."
                link="https://github.com" />
            </div>
          </section>
        );
      }

      /* ── FEEDBACK ── */
      function Feedback() {
        return (
          <section id="section-feedback" class="section">
            <div class="section-header">
              <span class="section-tag">06</span>
              <h2>Contact</h2>
            </div>
            <p class="section-sub">Leave a message, suggestion, or collaboration request.</p>
            <div class="feedback-card">
              <div class="feedback-terminal-bar">
                <span></span><span></span><span></span>
                <span class="terminal-title">send_message.sh</span>
              </div>
              <div class="feedback-body">
                <div class="form-group">
                  <label htmlFor="fb-email">Your Email</label>
                  <input type="email" id="fb-email" placeholder="you@example.com" />
                </div>
                <div class="form-group">
                  <label htmlFor="fb-msg">Message</label>
                  <textarea id="fb-msg" rows="5" placeholder="Type your message here..."></textarea>
                </div>
                <button class="submit-btn" type="button">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                  </svg>
                  Send Message
                </button>
              </div>
            </div>
          </section>
        );
      }

      /* ── FOOTER ── */
      function Footer() {
        return (
          <footer>
            <div class="footer-inner">
              <p class="footer-name">&lt;Abhinav Pathak /&gt;</p>
              <p class="footer-copy">© 2025 · Built with React · All rights reserved</p>
              <div class="footer-links">
                <a href="mailto:Pabhinav9001@gmail.com">Email</a>
                <a href="https://www.linkedin.com/in/Abhinav-Pathak-aa6a35233/" target="_blank">LinkedIn</a>
                <a href="https://github.com" target="_blank">GitHub</a>
              </div>
            </div>
          </footer>
        );
      }

      /* ── APP ── */
      const App = (
        <div class="app-root">
          <Navbar />
          <main>
            <Profile />
            <About />
            <Skills />
            <Certifications />
            <Projects />
            <Feedback />
          </main>
          <Footer />
        </div>
      );

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(App);

    </script>
  </body>
</html>
